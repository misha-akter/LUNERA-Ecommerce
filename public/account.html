
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Account | LUNÉRA</title>

    <style>
        :root {
            --bg: #f6f0e8;
            --card: #fffdf9;
            --ink: #30251e;
            --muted: #827366;
            --gold: #b18a58;
            --border: #e8ddd0;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: var(--bg);
            color: var(--ink);
        }

        button, a { -webkit-tap-highlight-color: transparent; }

        a { color: inherit; text-decoration: none; }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            padding: 20px 6%;
            background: var(--card);
            border-bottom: 1px solid var(--border);
        }

        .brand {
            font-size: 25px;
            letter-spacing: 5px;
            font-weight: bold;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 18px;
            flex-wrap: wrap;
        }

        .nav-links a {
            font-size: 14px;
            color: var(--muted);
        }

        .logout-btn {
            border: 0;
            background: var(--ink);
            color: white;
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
        }

        .container {
            width: min(1100px, 92%);
            margin: 38px auto;
        }

        .welcome {
            margin-bottom: 28px;
        }

        .welcome h1 {
            font-size: clamp(27px, 4vw, 38px);
            margin: 0 0 10px;
        }

        .welcome p {
            margin: 0;
            color: var(--muted);
            line-height: 1.6;
        }

        .layout {
            display: grid;
            grid-template-columns: 300px minmax(0, 1fr);
            gap: 22px;
            align-items: start;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 17px;
            padding: 25px;
            box-shadow: 0 8px 28px #39251608;
        }

        .card h2 {
            margin: 0 0 22px;
            font-size: 20px;
        }

        .avatar {
            width: 65px;
            height: 65px;
            display: grid;
            place-items: center;
            border-radius: 50%;
            background: #eee0ce;
            color: #765330;
            font-size: 26px;
            margin-bottom: 16px;
        }

        .customer-name {
            font-size: 19px;
            font-weight: bold;
            overflow-wrap: anywhere;
        }

        .customer-email {
            font-size: 13px;
            color: var(--muted);
            margin-top: 8px;
            overflow-wrap: anywhere;
        }

        .profile-field {
            margin-top: 22px;
            padding-top: 16px;
            border-top: 1px solid var(--border);
        }

        .field-label {
            font-size: 12px;
            color: var(--muted);
            margin-bottom: 7px;
        }

        .field-value {
            font-size: 14px;
            overflow-wrap: anywhere;
            line-height: 1.5;
        }

        .orders-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .orders-header h2 { margin: 0; }

        .count {
            background: #eee0ce;
            color: #765330;
            padding: 6px 11px;
            border-radius: 20px;
            font-size: 12px;
            white-space: nowrap;
        }

        .order {
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 14px;
        }

        .order-top {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
        }

        .order-id { font-weight: bold; }

        .order-date {
            font-size: 12px;
            color: var(--muted);
            margin-top: 6px;
        }

        .status {
            display: inline-block;
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 12px;
            text-transform: capitalize;
            background: #eee9e1;
            color: #64513e;
        }

        .status.delivered { background: #e1f2e5; color: #246238; }
        .status.cancelled { background: #f8e2e0; color: #922e28; }
        .status.shipped { background: #e1ebfb; color: #27569b; }

        .order-total {
            font-size: 20px;
            font-weight: bold;
            margin: 18px 0 12px;
        }

        .items {
            border-top: 1px solid var(--border);
            padding-top: 12px;
            margin-top: 12px;
        }

        .item-row {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            font-size: 13px;
            padding: 7px 0;
            color: var(--muted);
        }

        .item-row span:first-child {
            overflow-wrap: anywhere;
        }

        .item-row span:last-child {
            white-space: nowrap;
        }

        .toggle-btn {
            margin-top: 12px;
            padding: 9px 12px;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            color: var(--ink);
        }

        .empty, .loading, .error {
            text-align: center;
            padding: 32px 15px;
            color: var(--muted);
            line-height: 1.7;
        }

        .primary-link {
            display: inline-block;
            margin-top: 12px;
            background: var(--ink);
            color: white;
            border-radius: 8px;
            padding: 11px 15px;
        }

        .notice {
            padding: 13px 15px;
            border-radius: 9px;
            background: #f8e2e0;
            color: #922e28;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        footer {
            text-align: center;
            color: var(--muted);
            padding: 28px 15px;
            font-size: 12px;
        }

        @media (max-width: 750px) {
            .layout { grid-template-columns: 1fr; }
            .navbar { padding: 17px 4%; }
            .brand { font-size: 21px; }
            .nav-links { gap: 12px; }
            .container { margin-top: 26px; }
            .card { padding: 20px; }
        }
    </style>
</head>

<body>
    <header class="navbar">
        <a class="brand" href="/">LUNÉRA</a>

        <nav class="nav-links">
            <a href="/">Shop</a>
            <a href="#orders">My Orders</a>
            <button class="logout-btn" id="logoutBtn" type="button">
                Logout
            </button>
        </nav>
    </header>

    <main class="container">
        <section class="welcome">
            <h1 id="welcomeTitle">My Account</h1>
            <p>Manage your profile and keep track of your orders.</p>
        </section>

        <div id="notice" class="notice" hidden></div>

        <div class="layout">
            <section class="card">
                <h2>My Profile</h2>

                <div id="profileContent" class="loading">
                    Loading your profile...
                </div>
            </section>

            <section class="card" id="orders">
                <div class="orders-header">
                    <h2>My Orders</h2>
                    <span class="count" id="orderCount">Loading...</span>
                </div>

                <div id="ordersContent" class="loading">
                    Loading your orders...
                </div>
            </section>
        </div>
    </main>

    <footer>
        © <span id="year"></span> LUNÉRA. Your World, Your Style.
    </footer>

    <script>
        const profileContent = document.getElementById("profileContent");
        const ordersContent = document.getElementById("ordersContent");
        const orderCount = document.getElementById("orderCount");
        const notice = document.getElementById("notice");
        const logoutBtn = document.getElementById("logoutBtn");

        document.getElementById("year").textContent =
            new Date().getFullYear();

        function showNotice(message) {
            notice.textContent = message;
            notice.hidden = false;
        }

        async function apiRequest(url, options = {}) {
            const response = await fetch(url, {
                credentials: "same-origin",
                ...options,
                headers: {
                    ...(options.headers || {})
                }
            });

            const data = await response.json().catch(() => ({}));

            if (response.status === 401) {
                window.location.replace("/login.html");
                throw new Error("Please log in to view your account.");
            }

            if (!response.ok || !data.success) {
                throw new Error(data.message || "Something went wrong.");
            }

            return data;
        }

        function formatMoney(amount) {
            const value = Number(amount);

            if (!Number.isFinite(value)) return "৳0.00";

            return "৳" + value.toLocaleString("en-BD", {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            });
        }

        function formatDate(value) {
            if (!value) return "Date unavailable";

            const date = new Date(value);

            if (Number.isNaN(date.getTime())) {
                return "Date unavailable";
            }

            return date.toLocaleString("en-BD", {
                year: "numeric",
                month: "short",
                day: "numeric",
                hour: "numeric",
                minute: "2-digit"
            });
        }

        // Use textContent for customer-provided values.
        function addText(parent, tag, className, value) {
            const element = document.createElement(tag);

            if (className) element.className = className;

            element.textContent = value == null ? "" : String(value);
            parent.appendChild(element);

            return element;
        }

        async function loadProfile() {
            const data = await apiRequest("/api/customer/me");
            const customer = data.customer;

            document.getElementById("welcomeTitle").textContent =
                "Welcome, " + customer.name + "!";

            profileContent.replaceChildren();

            const avatar = addText(
                profileContent,
                "div",
                "avatar",
                (customer.name || "C").trim().charAt(0).toUpperCase()
            );

            avatar.setAttribute("aria-hidden", "true");

            addText(
                profileContent,
                "div",
                "customer-name",
                customer.name
            );

            addText(
                profileContent,
                "div",
                "customer-email",
                customer.email
            );

            const phoneField = document.createElement("div");
            phoneField.className = "profile-field";
            addText(phoneField, "div", "field-label", "Phone Number");
            addText(
                phoneField,
                "div",
                "field-value",
                customer.phone || "Not provided"
            );
            profileContent.appendChild(phoneField);

            const joinedField = document.createElement("div");
            joinedField.className = "profile-field";
            addText(joinedField, "div", "field-label", "Member Since");
            addText(
                joinedField,
                "div",
                "field-value",
                formatDate(customer.created_at)
            );
            profileContent.appendChild(joinedField);
        }

        function renderOrder(order) {
            const card = document.createElement("article");
            card.className = "order";

            const top = document.createElement("div");
            top.className = "order-top";

            const info = document.createElement("div");

            addText(info, "div", "order-id", "Order #" + order.id);
            addText(
                info,
                "div",
                "order-date",
                formatDate(order.created_at)
            );

            top.appendChild(info);

            const status = addText(
                top,
                "span",
                "status",
                order.status || "pending"
            );

            const statusName = String(order.status || "pending")
                .toLowerCase();

            if (
                ["delivered", "cancelled", "shipped"].includes(statusName)
            ) {
                status.classList.add(statusName);
            }

            card.appendChild(top);

            addText(
                card,
                "div",
                "order-total",
                formatMoney(order.total_amount)
            );

            const items = Array.isArray(order.items) ? order.items : [];
            const details = document.createElement("div");
            details.className = "items";
            details.hidden = true;

            if (items.length) {
                items.forEach(item => {
                    const row = document.createElement("div");
                    row.className = "item-row";

                    addText(
                        row,
                        "span",
                        "",
                        `${item.product_name} × ${item.quantity}`
                    );

                    addText(
                        row,
                        "span",
                        "",
                        formatMoney(item.subtotal)
                    );

                    details.appendChild(row);
                });
            } else {
                addText(
                    details,
                    "div",
                    "order-date",
                    "No item details available."
                );
            }

            const toggle = document.createElement("button");
            toggle.type = "button";
            toggle.className = "toggle-btn";
            toggle.textContent = "View order items";

            toggle.addEventListener("click", () => {
                details.hidden = !details.hidden;
                toggle.textContent = details.hidden
                    ? "View order items"
                    : "Hide order items";
            });

            card.appendChild(toggle);
            card.appendChild(details);

            return card;
        }

        async function loadOrders() {
            const data = await apiRequest("/api/customer/orders");

            orderCount.textContent = String(data.count || 0) + " orders";
            ordersContent.replaceChildren();

            if (!data.orders || data.orders.length === 0) {
                const empty = document.createElement("div");
                empty.className = "empty";

                addText(
                    empty,
                    "div",
                    "",
                    "You haven't placed any orders yet."
                );

                const link = document.createElement("a");
                link.href = "/";
                link.className = "primary-link";
                link.textContent = "Explore Products";

                empty.appendChild(link);
                ordersContent.appendChild(empty);
                return;
            }

            data.orders.forEach(order => {
                ordersContent.appendChild(renderOrder(order));
            });
        }

        async function initDashboard() {
            try {
                await loadProfile();
                await loadOrders();
            } catch (error) {
                profileContent.textContent =
                    "Unable to load your profile.";

                ordersContent.textContent =
                    "Unable to load your orders.";

                orderCount.textContent = "Unavailable";

                if (
                    error.message !==
                    "Please log in to view your account."
                ) {
                    showNotice(error.message);
                }
            }
        }

        logoutBtn.addEventListener("click", async () => {
            logoutBtn.disabled = true;
            logoutBtn.textContent = "Logging out...";

            try {
                await apiRequest("/api/customer/logout", {
                    method: "POST"
                });

                window.location.replace("/login.html");
            } catch (error) {
                showNotice(error.message || "Logout failed.");
                logoutBtn.disabled = false;
                logoutBtn.textContent = "Logout";
            }
        });

        initDashboard();
    </script>
</body>
</html>
