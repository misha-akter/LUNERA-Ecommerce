
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | LUNÉRA</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh; display: grid; place-items: center;
            padding: 24px; font-family: Arial, sans-serif;
            background: #f6f0e8; color: #30251e;
        }
        .card {
            width: 100%; max-width: 440px; background: #fffdf9;
            padding: 34px; border-radius: 20px;
            box-shadow: 0 15px 45px #39251618;
        }
        .brand { text-align: center; font-size: 30px; letter-spacing: 5px; }
        .sub { text-align: center; color: #827366; margin-bottom: 28px; }
        label { display: block; margin: 16px 0 7px; font-size: 14px; }
        input {
            width: 100%; padding: 13px; border: 1px solid #ded2c4;
            border-radius: 9px; font-size: 15px; background: white;
        }
        input:focus { outline: 2px solid #b18a58; border-color: transparent; }
        button {
            width: 100%; padding: 14px; margin-top: 23px; border: 0;
            border-radius: 9px; background: #30251e; color: white;
            font-size: 15px; cursor: pointer;
        }
        button:disabled { opacity: .6; cursor: wait; }
        #message { font-size: 14px; line-height: 1.5; }
        .links { text-align: center; margin-top: 22px; font-size: 14px; }
        a { color: #8b6238; }
        .back { display: block; text-align: center; margin-top: 18px; }
    </style>
</head>
<body>
    <main class="card">
        <div class="brand">LUNÉRA</div>
        <p class="sub">Create your account and discover your style.</p>

        <form id="registerForm">
            <label for="name">Full name</label>
            <input id="name" name="name" maxlength="100" autocomplete="name" required>

            <label for="email">Email address</label>
            <input id="email" name="email" type="email" maxlength="150"
                   autocomplete="email" required>

            <label for="phone">Phone number (optional)</label>
            <input id="phone" name="phone" type="tel" maxlength="30"
                   autocomplete="tel">

            <label for="password">Password</label>
            <input id="password" name="password" type="password"
                   minlength="8" autocomplete="new-password" required>

            <label for="confirmPassword">Confirm password</label>
            <input id="confirmPassword" name="confirmPassword" type="password"
                   minlength="8" autocomplete="new-password" required>

            <button id="submitButton" type="submit">Create Account</button>
            <p id="message" role="status" aria-live="polite"></p>
        </form>

        <div class="links">
            Already have an account? <a href="/login.html">Log in</a>
        </div>
        <a class="back" href="/">← Back to LUNÉRA</a>
    </main>

    <script>
        const form = document.getElementById("registerForm");
        const message = document.getElementById("message");
        const button = document.getElementById("submitButton");

        form.addEventListener("submit", async event => {
            event.preventDefault();
            message.textContent = "";

            const name = document.getElementById("name").value.trim();
            const email = document.getElementById("email").value.trim();
            const phone = document.getElementById("phone").value.trim();
            const password = document.getElementById("password").value;
            const confirmPassword =
                document.getElementById("confirmPassword").value;

            if (password !== confirmPassword) {
                message.textContent = "Passwords do not match.";
                return;
            }

            button.disabled = true;
            button.textContent = "Creating account...";

            try {
                const response = await fetch("/api/customer/register", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ name, email, phone, password })
                });

                const data = await response.json();

                if (!response.ok || !data.success) {
                    throw new Error(data.message || "Registration failed.");
                }

                message.textContent =
                    "Account created successfully! Redirecting to login...";
                form.reset();

                setTimeout(() => {
                    window.location.href = "/login.html";
                }, 1200);
            } catch (error) {
                message.textContent =
                    error.message || "Could not connect to the server.";
            } finally {
                button.disabled = false;
                button.textContent = "Create Account";
            }
        });
    </script>
</body>
</html>
